<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flosi Live Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--w:min(1180px,calc(100vw - 44px));--p:#8657ef;--bg:#f7f6fa;--text:#18151f;--muted:#918d98;--green:#31c68b;--red:#ff6b72;--blue:#3fa7f5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#ecebf1;color:var(--text);font-family:Cairo,Inter,system-ui,sans-serif}html[dir=ltr] body{font-family:Inter,Cairo,system-ui,sans-serif}button,input,select{font:inherit}.toolbar{position:sticky;top:0;z-index:50;min-height:58px;background:#17151d;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 18px}.toolbar .grow{flex:1}.toolbar label,.toolbar span{font-size:11px;color:#c8c3d0}.toolbar input{width:min(360px,32vw)}.toolbar button{border:0;border-radius:12px;background:#2a2731;color:#fff;padding:8px 12px;cursor:pointer}.stage{min-height:calc(100vh - 58px);display:flex;justify-content:center;padding:22px}.phone{position:relative;width:var(--w);min-width:320px;max-width:calc(100vw - 20px);min-height:760px;background:var(--bg);border-radius:28px;overflow:hidden;border:1px solid #d9d5e0;box-shadow:0 28px 80px #2b21452a}.screen{display:none;padding:28px 30px 106px;min-height:760px}.screen.active{display:block}.top,.pageHead,.row,.safe,.section,.switchRow{display:flex;align-items:center}.top,.section,.safe,.switchRow{justify-content:space-between}.top{margin-bottom:18px}.hello small,.label{display:block;color:var(--muted);font-size:11px}.hello b,.title{font-size:30px;font-weight:700}.round{width:46px;height:46px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 18px #261f3810;cursor:pointer}.hero{padding:28px;border-radius:30px;color:#fff;background:linear-gradient(135deg,#ab70ff,#8a59f4 54%,#6e3de5)}.balance{font-size:clamp(32px,4vw,52px);font-weight:700;margin:6px 0}.muted{opacity:.76;font-size:12px}.hero-grid,.grid,.statgrid{display:grid;gap:14px}.hero-grid,.grid{grid-template-columns:1fr 1fr;margin-top:20px}.glass{background:#ffffff18;border-radius:19px;padding:14px 16px}.glass strong{display:block;margin-top:4px}.grid{margin:14px 0}.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 20px #2b21450b}.icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}.blue{background:#eaf6ff;color:var(--blue)}.green{background:#eaf9f3;color:var(--green)}.purple{background:#f3eeff;color:var(--p)}.red{background:#fff0f1;color:var(--red)}.value{font-size:18px;font-weight:700}.section{margin:20px 2px 10px}.section b{font-size:18px}.section a{font-size:12px;color:var(--p);cursor:pointer}.row{gap:12px;padding:13px 0;border-bottom:1px solid #f0edf4;cursor:pointer}.row:last-child{border:0}.txt{flex:1}.txt b{display:block;font-size:13px}.txt small{color:#99939f;font-size:10px}.amount{font-size:12px;font-weight:700}.nav{position:absolute;bottom:0;left:0;right:0;height:82px;background:#fff;border-top:1px solid #f0edf4;display:flex;align-items:center;justify-content:space-around;z-index:25}.nav button{border:0;background:transparent;color:#8e8995;cursor:pointer;font-size:11px;min-width:72px}.nav button.active{color:var(--p);font-weight:700}.plus{width:58px!important;min-width:58px!important;height:58px;border-radius:50%!important;background:var(--p)!important;color:#fff!important;font-size:29px!important;transform:translateY(-15px)}.pageHead{gap:12px;margin-bottom:20px}.pageHead .back{margin-inline-start:auto}.settings{max-width:900px;margin:auto}.settings .row{background:#fff;border:0;border-radius:20px;margin:9px 0;padding:15px}.chev{font-size:18px;color:#7151d9}.switchRow{padding:14px 0;border-bottom:1px solid #f0edf4}.switch{width:48px;height:28px;border-radius:99px;background:#ddd8e5;padding:3px;cursor:pointer}.switch i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--p)}html[dir=rtl] .switch.on i{transform:translateX(-20px)}html[dir=ltr] .switch.on i{transform:translateX(20px)}.field{display:grid;gap:6px;margin:13px 0}.field select,.field input{border:1px solid #e5e0eb;border-radius:14px;padding:12px;background:#faf9fc}.languageGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.lang{border:1px solid #ece7f2;border-radius:16px;background:#fff;padding:12px;cursor:pointer;text-align:start}.lang.active{border-color:var(--p);background:#f6f1ff;color:#6f43d8}.lang b{display:block;font-size:13px}.lang small{color:var(--muted);font-size:10px}.primary,.secondary{border:0;border-radius:14px;padding:11px 16px;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#f1eef6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.statgrid{grid-template-columns:repeat(3,1fr);margin:14px 0}.stat{background:#fff;border-radius:20px;padding:16px}.stat b{font-size:22px;display:block}.chart{height:220px;background:linear-gradient(180deg,#f7f2ff,#fff);border-radius:22px;padding:18px;display:flex;align-items:end;gap:10px}.bar{flex:1;background:linear-gradient(#a96dff,#7d4bee);border-radius:12px 12px 6px 6px;min-height:18px}.tableWrap{overflow:auto}.dataTable{width:100%;border-collapse:collapse;min-width:620px}.dataTable th,.dataTable td{padding:11px;border-bottom:1px solid #f0edf4;text-align:start;font-size:12px}.modal{position:fixed;inset:0;background:#15131b99;display:none;align-items:center;justify-content:center;z-index:100;padding:18px}.modal.open{display:flex}.sheet{width:min(520px,96vw);background:#fff;border-radius:28px;padding:22px}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#17151d;color:#fff;border-radius:14px;padding:10px 16px;font-size:12px;opacity:0;transition:.2s;z-index:150}.toast.show{opacity:1}@media(min-width:900px){#home.active{display:grid;grid-template-columns:1.1fr .9fr;gap:16px 18px}.top{grid-column:1/-1}.hero{grid-column:1}.grid{grid-column:2;margin:0}.section,#recent{grid-column:1/-1}}@media(max-width:720px){.toolbar{flex-wrap:wrap}.toolbar input{width:160px}.stage{padding:0}.phone{width:100%!important;max-width:none;min-height:100vh;border:0;border-radius:0}.screen{padding:22px 18px 96px;min-height:100vh}.statgrid{grid-template-columns:1fr}.languageGrid{grid-template-columns:1fr 1fr}.nav{position:fixed}.nav button{min-width:50px}}
</style>
</head>
<body>
<div class="toolbar" dir="ltr"><b>Flosi Live Preview</b><label>Width</label><input id="size" type="range" min="360" max="1500" value="1180"><span id="sizeValue">1180px</span><div class="grow"></div><button id="fit">Fit</button><button id="phoneBtn">390px</button></div>
<div class="stage"><main class="phone">
<section class="screen active" id="home"><header class="top"><div class="hello"><small data-t="morning"></small><b>Flosi</b></div><button class="round" data-go="me">⚙</button></header><section class="hero"><div class="muted" data-t="total"></div><div class="balance">12,840.50 <small class="currencyText">USD</small></div><div class="muted" data-t="month"></div><div class="hero-grid"><div class="glass"><span class="muted" data-t="income"></span><strong>4,850.00</strong></div><div class="glass"><span class="muted" data-t="expense"></span><strong>3,430.00</strong></div></div></section><div class="grid"><div class="card"><div class="label" data-t="todayIncome"></div><div class="value">620.00</div></div><div class="card"><div class="label" data-t="todayExpense"></div><div class="value">184.50</div></div></div><div class="section"><b data-t="recent"></b><a data-go="activity" data-t="viewAll"></a></div><section class="card" id="recent"><div class="row"><div class="icon red">●</div><div class="txt"><b data-t="shopping"></b><small>Visa</small></div><div class="amount" style="color:var(--red)">−86.20</div></div><div class="row"><div class="icon green">●</div><div class="txt"><b data-t="salary"></b><small data-t="mainAccount"></small></div><div class="amount" style="color:var(--green)">+2,500.00</div></div></section></section>
<section class="screen" id="activity"><div class="pageHead"><div><div class="label" data-t="allAccounts"></div><div class="title" data-t="transactions"></div></div><button class="round back" data-go="home">→</button></div><div class="card"><div class="row"><div class="icon red">●</div><div class="txt"><b data-t="shopping"></b><small>10:20</small></div><div class="amount" style="color:var(--red)">−86.20</div></div><div class="row"><div class="icon green">●</div><div class="txt"><b data-t="salary"></b><small data-t="mainAccount"></small></div><div class="amount" style="color:var(--green)">+2,500</div></div></div></section>
<section class="screen" id="me"><div class="pageHead"><div><div class="label" data-t="settingsPrivacy"></div><div class="title" data-t="me"></div></div><button class="round back" data-go="home">→</button></div><div class="settings"><div class="row" data-go="security"><div class="icon purple">🔒</div><div class="txt"><b data-t="security"></b><small data-t="securityDesc"></small></div><div class="chev">‹</div></div><div class="row" data-go="locale"><div class="icon blue">🌐</div><div class="txt"><b data-t="languageCurrency"></b><small id="localeSummary"></small></div><div class="chev">‹</div></div><div class="row" data-go="reports"><div class="icon green">▥</div><div class="txt"><b data-t="reportsTables"></b><small data-t="reportsDesc"></small></div><div class="chev">‹</div></div></div></section>
<section class="screen" id="security"><div class="pageHead"><div><div class="label" data-t="privacy"></div><div class="title" data-t="security"></div></div><button class="round back" data-go="me">→</button></div><div class="card"><div class="switchRow"><b data-t="biometrics"></b><div class="switch on"><i></i></div></div><div class="switchRow"><b data-t="pin"></b><div class="switch on"><i></i></div></div><div class="switchRow"><b data-t="autoLock"></b><div class="switch on"><i></i></div></div><div class="switchRow"><b data-t="hideRecent"></b><div class="switch"><i></i></div></div><div class="switchRow"><b data-t="blockShots"></b><div class="switch on"><i></i></div></div></div></section>
<section class="screen" id="locale"><div class="pageHead"><div><div class="label" data-t="globalSettings"></div><div class="title" data-t="languageCurrency"></div></div><button class="round back" data-go="me">→</button></div><div class="card"><div class="section" style="margin-top:0"><b data-t="appLanguage"></b><span id="langCount" class="label"></span></div><div class="languageGrid" id="languageGrid"></div><div class="field"><label data-t="baseCurrency"></label><select id="currency"><option>USD</option><option>EUR</option><option>GBP</option><option>SAR</option><option>AED</option><option>KWD</option><option>QAR</option><option>JOD</option><option>IQD</option><option>EGP</option><option>TRY</option><option>INR</option><option>JPY</option><option>CNY</option><option>KRW</option><option>CAD</option><option>AUD</option><option>CHF</option><option>BRL</option><option>MXN</option><option>ZAR</option></select></div><button class="primary" id="saveLocale" data-t="saveSettings"></button></div></section>
<section class="screen" id="reports"><div class="pageHead"><div><div class="label" data-t="visualAnalysis"></div><div class="title" data-t="reportsTables"></div></div><button class="round back" data-go="me">→</button></div><div class="statgrid"><div class="stat"><span class="label" data-t="monthlyExpense"></span><b>3,430</b></div><div class="stat"><span class="label" data-t="savings"></span><b>29%</b></div><div class="stat"><span class="label" data-t="net"></span><b>1,420</b></div></div><div class="card"><div class="chart"><div class="bar" style="height:35%"></div><div class="bar" style="height:52%"></div><div class="bar" style="height:41%"></div><div class="bar" style="height:72%"></div><div class="bar" style="height:63%"></div><div class="bar" style="height:88%"></div></div></div><div class="card tableWrap" style="margin-top:14px"><table class="dataTable"><thead><tr><th data-t="date"></th><th data-t="category"></th><th data-t="account"></th><th data-t="amount"></th></tr></thead><tbody><tr><td>23 Aug</td><td data-t="shopping"></td><td>Visa</td><td>−86.20</td></tr><tr><td>23 Aug</td><td data-t="salary"></td><td data-t="mainAccount"></td><td>+2,500</td></tr></tbody></table></div><div class="actions"><button class="secondary">CSV</button><button class="secondary">PDF</button><button class="secondary">XLSX</button></div></section>
<nav class="nav"><button data-go="home" class="active">⌂<br><span data-t="today"></span></button><button data-go="activity">▤<br><span data-t="transactions"></span></button><button class="plus" id="addBtn">+</button><button data-go="reports">▥<br><span data-t="reports"></span></button><button data-go="me">♙<br><span data-t="me"></span></button></nav></main></div>
<div class="modal" id="addModal"><div class="sheet"><h3 data-t="addTransaction"></h3><div class="field"><label data-t="description"></label><input id="txName" value="Coffee"></div><div class="field"><label data-t="amount"></label><input id="txAmount" type="number" value="12"></div><div class="actions"><button class="primary" id="saveTx" data-t="save"></button><button class="secondary" id="closeModal" data-t="cancel"></button></div></div></div><div class="toast" id="toast"></div>
<script src="i18n.js"></script>
<script>
const languages=Object.entries(window.FLOSI_I18N).map(([c,v])=>({c,n:v.name,dir:v.dir}));let currentLang=localStorage.getItem('flosiLang')||'ar';const grid=document.getElementById('languageGrid'),cur=document.getElementById('currency');cur.value=localStorage.getItem('flosiCurrency')||'USD';
function renderLanguages(){grid.innerHTML=languages.map(l=>`<button class="lang ${l.c===currentLang?'active':''}" data-lang="${l.c}"><b>${l.n}</b><small>${l.c.toUpperCase()} • ${l.dir.toUpperCase()}</small></button>`).join('');document.getElementById('langCount').textContent=languages.length;grid.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));}
function setLanguage(code){const pack=window.FLOSI_I18N[code]||window.FLOSI_I18N.en;currentLang=code;localStorage.setItem('flosiLang',code);document.documentElement.lang=code;document.documentElement.dir=pack.dir;document.querySelectorAll('[data-t]').forEach(el=>{const v=pack.t[el.dataset.t];if(v!==undefined)el.textContent=v});document.getElementById('localeSummary').textContent=pack.name+' • '+cur.value;renderLanguages();}
document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.nav button[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));}
document.querySelectorAll('.switch').forEach(s=>s.onclick=()=>s.classList.toggle('on'));document.getElementById('saveLocale').onclick=()=>{localStorage.setItem('flosiCurrency',cur.value);document.querySelectorAll('.currencyText').forEach(x=>x.textContent=cur.value);setLanguage(currentLang);showToast(window.FLOSI_I18N[currentLang].t.saved)};
document.getElementById('addBtn').onclick=()=>document.getElementById('addModal').classList.add('open');document.getElementById('closeModal').onclick=()=>document.getElementById('addModal').classList.remove('open');document.getElementById('saveTx').onclick=()=>{const n=document.getElementById('txName').value,a=document.getElementById('txAmount').value;document.getElementById('recent').insertAdjacentHTML('afterbegin',`<div class="row"><div class="icon red">●</div><div class="txt"><b>${n}</b><small>${window.FLOSI_I18N[currentLang].t.today}</small></div><div class="amount" style="color:var(--red)">−${a}</div></div>`);document.getElementById('addModal').classList.remove('open');showToast(window.FLOSI_I18N[currentLang].t.saved)};
const toast=document.getElementById('toast');function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}const size=document.getElementById('size'),sv=document.getElementById('sizeValue');function apply(v){document.documentElement.style.setProperty('--w',v+'px');sv.textContent=v+'px'}size.oninput=e=>apply(e.target.value);document.getElementById('fit').onclick=()=>apply(Math.max(360,innerWidth-44));document.getElementById('phoneBtn').onclick=()=>apply(390);document.querySelectorAll('.currencyText').forEach(x=>x.textContent=cur.value);renderLanguages();setLanguage(currentLang);
</script>
</body></html>
