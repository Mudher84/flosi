<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Flosi 2.0</title><style>html,body{margin:0;min-height:100%;background:#f7f6fb}</style></head><body><script>(async()=>{try{const res=await fetch('flosi2.html?v=20260823-1425',{cache:'no-store'});if(!res.ok)throw new Error('load '+res.status);const text=await res.text();const src=new DOMParser().parseFromString(text,'text/html');const originalScripts=[...src.querySelectorAll('script')].map(s=>s.textContent);src.querySelectorAll('script').forEach(s=>s.remove());document.documentElement.lang=src.documentElement.lang||'ar';document.documentElement.dir=src.documentElement.dir||'rtl';document.head.innerHTML=src.head.innerHTML;document.body.innerHTML=src.body.innerHTML;for(const code of originalScripts){try{new Function(code)()}catch(e){console.error('Flosi base script:',e)}}const main=document.querySelector('main.main');if(!main)throw new Error('main missing');main.insertAdjacentHTML('beforeend',`<section class="screen" id="security"><div class="head"><div class="headCopy"><div class="eyebrow">الخصوصية</div><h1 class="title">الأمان</h1><div class="sub">حماية الوصول إلى بياناتك المالية</div></div><button class="round" data-settings-back>←</button></div><div class="panel"><div class="settingsRow"><div class="txt"><b>البصمة والوجه</b><small>فتح التطبيق بالقياسات الحيوية</small></div><input type="checkbox" checked></div><div class="settingsRow"><div class="txt"><b>رمز PIN</b><small>رمز احتياطي للدخول</small></div><input type="checkbox" checked></div><div class="settingsRow"><div class="txt"><b>القفل التلقائي</b><small>قفل التطبيق بعد الخمول</small></div><input type="checkbox" checked></div><div class="settingsRow"><div class="txt"><b>حماية لقطات الشاشة</b><small>حماية الصفحات الحساسة</small></div><input type="checkbox" checked></div></div></section><section class="screen" id="locale"><div class="head"><div class="headCopy"><div class="eyebrow">إعدادات عالمية</div><h1 class="title">اللغة والعملة</h1><div class="sub">اختر لغة التطبيق وعملتك الأساسية</div></div><button class="round" data-settings-back>←</button></div><div class="panel"><div class="field"><label>اللغة</label><select id="settingsLang"><option>العربية</option><option>English</option><option>简体中文</option><option>Español</option><option>Français</option><option>Deutsch</option><option>Türkçe</option><option>فارسی</option><option>اردو</option><option>हिन्दी</option><option>Português</option><option>Italiano</option><option>Русский</option><option>日本語</option><option>한국어</option></select></div><div class="field"><label>العملة</label><select id="settingsCurrency"><option>USD</option><option>IQD</option><option>EUR</option><option>GBP</option><option>SAR</option><option>AED</option><option>KWD</option><option>QAR</option><option>JPY</option><option>CNY</option><option>INR</option><option>TRY</option><option>CAD</option><option>AUD</option></select></div><button class="btn primary" id="settingsSaveLocale">حفظ الإعدادات</button></div></section><section class="screen" id="backup"><div class="head"><div class="headCopy"><div class="eyebrow">البيانات</div><h1 class="title">النسخ الاحتياطي المشفر</h1><div class="sub">نسخ واستعادة بياناتك بأمان</div></div><button class="round" data-settings-back>←</button></div><div class="panel"><div class="settingsRow"><div class="txt"><b>حالة النسخ</b><small id="settingsBackupStatus">لم يتم إنشاء نسخة بعد</small></div><span>🔐</span></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="settingsBackupNow">إنشاء نسخة الآن</button><button class="btn secondary" id="settingsRestore">استعادة نسخة</button></div></div></section><section class="screen" id="pro"><div class="head"><div class="headCopy"><div class="eyebrow">FLOSI PRO</div><h1 class="title">Flosi Pro</h1><div class="sub">ميزات متقدمة لإدارة أموالك</div></div><button class="round" data-settings-back>←</button></div><div class="panel"><h2 style="margin-top:0">فلوسي برو</h2><p class="sub" style="font-size:12px;line-height:1.9">تحليلات متقدمة • تنبيهات ذكية • حسابات وأهداف غير محدودة • مزامنة ونسخ احتياطي • تقارير احترافية</p><button class="btn primary" id="settingsStartPro">ابدأ التجربة</button></div></section>`);const screens=()=>[...document.querySelectorAll('.screen')];function show(id){const target=document.getElementById(id);if(!target){console.error('Missing screen',id);return}screens().forEach(s=>s.classList.toggle('active',s===target));document.querySelectorAll('.nav [data-go],.sideNav [data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));window.scrollTo(0,0)}document.querySelectorAll('#me [data-go]').forEach(b=>{if(['security','locale','backup','pro'].includes(b.dataset.go))b.onclick=e=>{e.preventDefault();e.stopPropagation();show(b.dataset.go)}});document.querySelectorAll('[data-settings-back]').forEach(b=>b.onclick=e=>{e.preventDefault();show('me')});document.getElementById('settingsSaveLocale').onclick=()=>{localStorage.setItem('flosi-lang',document.getElementById('settingsLang').value);localStorage.setItem('flosi-currency',document.getElementById('settingsCurrency').value);alert('تم حفظ الإعدادات')};document.getElementById('settingsBackupNow').onclick=()=>{document.getElementById('settingsBackupStatus').textContent='آخر نسخة: الآن';localStorage.setItem('flosi-backup',new Date().toISOString())};document.getElementById('settingsRestore').onclick=()=>alert('تمت محاكاة الاستعادة بنجاح');document.getElementById('settingsStartPro').onclick=()=>alert('تم بدء تجربة Flosi Pro');show('home')}catch(e){console.error(e);document.body.innerHTML='<div style="padding:30px;font-family:system-ui;direction:rtl"><h2>تعذر تحميل Flosi</h2><pre style="white-space:pre-wrap">'+String(e)+'</pre></div>'}})();</script></body></html>
