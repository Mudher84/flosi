<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flosi 2.0</title><style>html,body{margin:0;min-width:100%;min-height:100%;background:#f7f6fb}#app{position:fixed;inset:0;width:100vw;height:100vh;border:0;display:block;background:#f7f6fb}</style></head><body><iframe id="app" src="flosi2.html?v=20260823-blankfix"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const m=d.querySelector('main.main');if(!m)return;if(!d.getElementById('security')){m.insertAdjacentHTML('beforeend',`<section class="screen" id="security"><div class="head"><div class="headCopy"><div class="eyebrow">الخصوصية</div><h1 class="title">الأمان</h1><div class="sub">حماية الوصول إلى بياناتك المالية</div></div><button class="round" data-settings-back>←</button></div><div class="panel"><div class="settingsRow"><div class="txt"><b>البصمة والوجه</b><small>فتح التطبيق بالقياسات الحيوية</small></div><span>مفعّل</span></div><div class="settingsRow"><div class="txt"><b>رمز PIN</b><small>رمز احتياطي للدخول</small></div><span>مفعّل</span></div><div class="settingsRow"><div class="txt"><b>القفل التلقائي</b><small>قفل التطبيق بعد الخمول</small></div><span>مفعّل</span></div></div></section><section class="screen" id="locale"><div class="head"><div class="headCopy"><div class="eyebrow">إعدادات عالمية</div><h1 class="title">اللغة والعملة</h1></div><button class="round" data-settings-back>←</button></div><div class="panel"><div class="settingsRow"><div class="txt"><b>العربية</b><small>اللغة الحالية</small></div><span>✓</span></div><div class="settingsRow"><div class="txt"><b>USD</b><small>العملة الأساسية</small></div><span>›</span></div></div></section><section class="screen" id="backup"><div class="head"><div class="headCopy"><div class="eyebrow">البيانات</div><h1 class="title">النسخ الاحتياطي المشفر</h1></div><button class="round" data-settings-back>←</button></div><div class="panel"><p class="sub">نسخ واستعادة بياناتك بأمان.</p><button class="btn primary" id="backupNow">إنشاء نسخة الآن</button></div></section><section class="screen" id="pro"><div class="head"><div class="headCopy"><div class="eyebrow">FLOSI PRO</div><h1 class="title">Flosi Pro</h1></div><button class="round" data-settings-back>←</button></div><div class="panel"><b>ذكاء مالي وتقارير ومزامنة متقدمة</b><p class="sub">كل الميزات الاحترافية في مكان واحد.</p><button class="btn primary">ابدأ التجربة</button></div></section>`)}function show(id){d.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));f.contentWindow.scrollTo(0,0)}d.querySelectorAll('#me [data-go]').forEach(b=>{b.onclick=e=>{e.preventDefault();e.stopPropagation();show(b.dataset.go)}});d.querySelectorAll('[data-settings-back]').forEach(b=>b.onclick=()=>show('me'));const backup=d.getElementById('backupNow');if(backup)backup.onclick=e=>e.currentTarget.textContent='تم إنشاء النسخة ✓';});</script></body></html>
