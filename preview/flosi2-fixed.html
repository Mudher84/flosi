<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flosi Settings Fix</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="flosi2.html"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const d=f.contentDocument,m=d.querySelector('main.main');if(!m)return;const pages='<section class="screen" id="security"><div class="head"><div class="headCopy"><div class="eyebrow">الخصوصية</div><h1 class="title">الأمان</h1></div><button class="round" data-back>←</button></div><div class="panel"><div class="settingsRow"><div class="txt"><b>البصمة والوجه</b><small>فتح التطبيق بالقياسات الحيوية</small></div><span>مفعّل</span></div><div class="settingsRow"><div class="txt"><b>رمز PIN</b><small>رمز احتياطي للدخول</small></div><span>مفعّل</span></div><div class="settingsRow"><div class="txt"><b>القفل التلقائي</b><small>قفل التطبيق بعد الخمول</small></div><span>مفعّل</span></div></div></section><section class="screen" id="locale"><div class="head"><div class="headCopy"><div class="eyebrow">إعدادات عالمية</div><h1 class="title">اللغة والعملة</h1></div><button class="round" data-back>←</button></div><div class="panel"><div class="settingsRow"><div class="txt"><b>العربية</b><small>اللغة الحالية</small></div><span>✓</span></div><div class="settingsRow"><div class="txt"><b>USD</b><small>العملة الأساسية</small></div><span>›</span></div></div></section><section class="screen" id="backup"><div class="head"><div class="headCopy"><div class="eyebrow">البيانات</div><h1 class="title">النسخ الاحتياطي المشفر</h1></div><button class="round" data-back>←</button></div><div class="panel"><p class="sub">نسخ واستعادة بياناتك بأمان.</p><button class="btn primary" id="backupNow">إنشاء نسخة الآن</button></div></section><section class="screen" id="pro"><div class="head"><div class="headCopy"><div class="eyebrow">FLOSI PRO</div><h1 class="title">Flosi Pro</h1></div><button class="round" data-back>←</button></div><div class="panel"><b>ذكاء مالي وتقارير ومزامنة متقدمة</b><p class="sub">كل الميزات الاحترافية في مكان واحد.</p><button class="btn primary">ابدأ التجربة</button></div></section>';m.insertAdjacentHTML('beforeend',pages);function show(id){d.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));f.contentWindow.scrollTo(0,0)}d.querySelectorAll('#me [data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));d.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('me'));d.getElementById('backupNow').onclick=e=>e.target.textContent='تم إنشاء النسخة ✓';};</script></body></html>
