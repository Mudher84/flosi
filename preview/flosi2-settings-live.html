<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Flosi 2 Live</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f6fb}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="flosi2.html?v=20260823-1408"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument,w=f.contentWindow,main=d.querySelector('main.main');if(!main)return;const extra=`<section class="screen" id="security"><div class="head"><div class="headCopy"><div class="eyebrow">الخصوصية</div><h1 class="title">الأمان</h1><div class="sub">حماية بياناتك المالية</div></div><button class="round" data-back="me">←</button></div><div class="panel"><div class="settingsRow"><div class="txt"><b>البصمة والوجه</b><small>فتح التطبيق بالقياسات الحيوية</small></div><input type="checkbox" checked></div><div class="settingsRow"><div class="txt"><b>رمز PIN</b><small>رمز احتياطي للدخول</small></div><input type="checkbox" checked></div><div class="settingsRow"><div class="txt"><b>القفل التلقائي</b><small>قفل التطبيق بعد الخمول</small></div><input type="checkbox" checked></div><div class="settingsRow"><div class="txt"><b>حماية لقطات الشاشة</b><small>منع ظهور البيانات الحساسة</small></div><input type="checkbox" checked></div></div></section><section class="screen" id="locale"><div class="head"><div class="headCopy"><div class="eyebrow">إعدادات عالمية</div><h1 class="title">اللغة والعملة</h1><div class="sub">اختر لغة التطبيق وعملتك الأساسية</div></div><button class="round" data-back="me">←</button></div><div class="panel"><div class="field"><label>اللغة</label><select id="liveLang"><option>العربية</option><option>English</option><option>简体中文</option><option>Español</option><option>Français</option><option>Deutsch</option><option>Türkçe</option><option>فارسی</option><option>اردو</option><option>हिन्दी</option></select></div><div class="field"><label>العملة</label><select id="liveCurrency"><option>USD</option><option>IQD</option><option>EUR</option><option>GBP</option><option>SAR</option><option>AED</option><option>KWD</option><option>QAR</option><option>JPY</option><option>CNY</option></select></div><button class="btn primary" id="saveLocaleLive">حفظ الإعدادات</button></div></section><section class="screen" id="backup"><div class="head"><div class="headCopy"><div class="eyebrow">البيانات</div><h1 class="title">النسخ الاحتياطي المشفر</h1><div class="sub">نسخ واستعادة بياناتك بأمان</div></div><button class="round" data-back="me">←</button></div><div class="panel"><div class="settingsRow"><div class="txt"><b>حالة النسخ</b><small id="backupStatusLive">لم يتم إنشاء نسخة بعد</small></div><span>🔐</span></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" id="backupNowLive">إنشاء نسخة الآن</button><button class="btn secondary" id="restoreLive">استعادة نسخة</button></div></div></section><section class="screen" id="pro"><div class="head"><div class="headCopy"><div class="eyebrow">FLOSI PRO</div><h1 class="title">Flosi Pro</h1><div class="sub">ميزات متقدمة لإدارة أموالك</div></div><button class="round" data-back="me">←</button></div><div class="panel"><h2 style="margin-top:0">فلوسي برو</h2><p class="sub" style="font-size:12px;line-height:1.9">تحليلات متقدمة • تنبيهات ذكية • حسابات وأهداف غير محدودة • مزامنة ونسخ احتياطي • تقارير احترافية</p><button class="btn primary" id="startProLive">ابدأ التجربة</button></div></section>`;main.insertAdjacentHTML('beforeend',extra);function show(id){d.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));d.querySelectorAll('.nav [data-go],.sideNav [data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));w.scrollTo(0,0)}d.querySelectorAll('#me [data-go]').forEach(b=>{b.onclick=e=>{e.preventDefault();e.stopPropagation();show(b.dataset.go)}});d.querySelectorAll('[data-back]').forEach(b=>b.onclick=e=>{e.preventDefault();show(b.dataset.back)});d.getElementById('saveLocaleLive').onclick=()=>{localStorage.setItem('flosi-lang',d.getElementById('liveLang').value);localStorage.setItem('flosi-currency',d.getElementById('liveCurrency').value);alert('تم حفظ الإعدادات')};d.getElementById('backupNowLive').onclick=()=>{d.getElementById('backupStatusLive').textContent='آخر نسخة: الآن';localStorage.setItem('flosi-backup',new Date().toISOString())};d.getElementById('restoreLive').onclick=()=>alert('تمت محاكاة الاستعادة بنجاح');d.getElementById('startProLive').onclick=()=>alert('تم بدء تجربة Flosi Pro');});</script></body></html>
