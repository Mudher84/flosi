<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Flosi Live</title><style>html,body{margin:0;min-height:100%;background:#f7f6fb}</style></head>

</script>
