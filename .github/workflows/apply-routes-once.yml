name: Apply Flosi routes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-routes-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire route controller
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('preview/flosi2.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="flosi-routes.js?v=20260823-1738-routes"></script>'
          if 'flosi-routes.js' not in s:
              s = s.replace('</body>', tag + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')

          idx = Path('preview/index.html')
          t = idx.read_text(encoding='utf-8')
          t = re.sub(r'flosi2\.html\?v=[^\"\']+', 'flosi2.html?v=20260823-1738-routes', t)
          idx.write_text(t, encoding='utf-8')
          PY

      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Flosi Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add preview/flosi2.html preview/index.html
          git commit -m 'feat: wire all Flosi pages and subpages'
          git push origin main
