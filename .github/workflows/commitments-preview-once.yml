name: Flosi Commitments Preview Once
on:
  push:
    paths:
      - '.github/workflows/commitments-preview-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire commitments runtime and refresh cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('preview/flosi2.html')
          text=html.read_text(encoding='utf-8')
          anchor='<script src="flosi-goals.js?v=20260823-goals-edit-1"></script>'
          script='<script src="flosi-commitments.js?v=20260823-commitments-edit-1"></script>'
          if script not in text:
              if anchor not in text:
                  raise SystemExit('goals script anchor not found')
              text=text.replace(anchor, anchor+'\n'+script)
          html.write_text(text,encoding='utf-8')

          index=Path('preview/index.html')
          text=index.read_text(encoding='utf-8')
          text=text.replace('flosi2.html?v=20260823-goals-edit-1','flosi2.html?v=20260823-commitments-edit-1')
          index.write_text(text,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/commitments-preview-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/flosi2.html preview/index.html .github/workflows/commitments-preview-once.yml
          git commit -m 'feat: wire editable commitments into preview'
          git push
