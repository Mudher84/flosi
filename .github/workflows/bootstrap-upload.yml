name: Bootstrap Flosi Source

on:
  push:
    branches: [ main ]
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive
        run: |
          cat \
            bootstrap/chunk-00 bootstrap/chunk-01 bootstrap/chunk-02 \
            bootstrap/chunk-03 bootstrap/chunk-04 bootstrap/chunk-05 \
            bootstrap/chunk-06 bootstrap/chunk-07 bootstrap/chunk-08 \
            bootstrap/chunk-09a bootstrap/chunk-10a bootstrap/chunk-10b \
            | base64 -d > flosi-source.zip
          unzip -t flosi-source.zip
          unzip -o flosi-source.zip -d .bootstrap
          cp -a .bootstrap/flosi-native-v1.4-premium-rtl-home/. .
          rm -rf .bootstrap flosi-source.zip bootstrap .github/workflows/bootstrap-upload.yml
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Flosi v1.4 premium RTL source"
          git push
