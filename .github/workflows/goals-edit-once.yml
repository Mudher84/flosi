name: Flosi Goals Edit Once
on:
  push:
    paths:
      - '.github/workflows/goals-edit-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch preview goal ownership and script wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          state=Path('preview/flosi-preview-state.js')
          text=state.read_text(encoding='utf-8')
          old="""  document.querySelectorAll('.goalRing').forEach(el=>{const b=el.querySelector('b');if(b)setText(b,'0%');el.style.background='conic-gradient(var(--p) 0 0%,#eeeaf4 0)'});\n  document.querySelectorAll('.goalText small').forEach(el=>setText(el,`0 / 0 ${currency}`));\n"""
          if old in text:
              text=text.replace(old,'')
          state.write_text(text,encoding='utf-8')

          html=Path('preview/flosi2.html')
          text=html.read_text(encoding='utf-8')
          anchor='<script src="flosi-latin-digits.js?v=20260823-latn"></script>'
          goal='<script src="flosi-goals.js?v=20260823-goals-edit-1"></script>'
          if goal not in text:
              if anchor not in text:
                  raise SystemExit('latin digits script anchor not found')
              text=text.replace(anchor,anchor+'\n'+goal)
          html.write_text(text,encoding='utf-8')

          index=Path('preview/index.html')
          text=index.read_text(encoding='utf-8')
          text=text.replace('flosi2.html?v=20260823-zero-iqd-1','flosi2.html?v=20260823-goals-edit-1')
          index.write_text(text,encoding='utf-8')
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/goals-edit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/flosi-preview-state.js preview/flosi2.html preview/index.html .github/workflows/goals-edit-once.yml
          git commit -m 'feat: add editable goals to planning preview'
          git push
