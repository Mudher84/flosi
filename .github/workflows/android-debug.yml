name: Android Signed Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Flosi signing keystore
        shell: bash
        env:
          FLOSI_KEYSTORE_BASE64: ${{ secrets.FLOSI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FLOSI_KEYSTORE_BASE64"
          CLEANED="$(printf '%s' "$FLOSI_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')"
          test -n "$CLEANED"
          printf '%s' "$CLEANED" | base64 --decode > "$RUNNER_TEMP/flosi-release.keystore"
          test -s "$RUNNER_TEMP/flosi-release.keystore"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          FLOSI_STORE_FILE: ${{ runner.temp }}/flosi-release.keystore
          FLOSI_KEYSTORE_PASSWORD: ${{ secrets.FLOSI_KEYSTORE_PASSWORD }}
          FLOSI_KEY_ALIAS: ${{ secrets.FLOSI_KEY_ALIAS }}
          FLOSI_KEY_PASSWORD: ${{ secrets.FLOSI_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: flosi-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
