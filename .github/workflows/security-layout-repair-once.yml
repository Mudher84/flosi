name: Flosi Security Layout Repair Once
on:
  push:
    paths:
      - '.github/workflows/security-layout-repair-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire repair script and bump preview cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('preview/flosi2.html')
          text=html.read_text(encoding='utf-8')
          script='<script src="flosi-security-layout-repair.js?v=20260823-security-layout-repair-1"></script>'
          if script not in text:
              text=text.replace('</body>',script+'\n</body>')
          html.write_text(text,encoding='utf-8')

          index=Path('preview/index.html')
          text=index.read_text(encoding='utf-8')
          import re
          text=re.sub(r'flosi2\.html\?v=[^\"\'<> ]+','flosi2.html?v=20260823-security-layout-repair-1',text)
          index.write_text(text,encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/security-layout-repair-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/flosi2.html preview/index.html .github/workflows/security-layout-repair-once.yml
          git commit -m 'fix: restore password dialog layout after note regression'
          git push
