name: Apply Latin digits once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-latin-digits-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate runtime
        run: node --check preview/flosi-latin-digits.js
      - name: Wire runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('preview/flosi2.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="flosi-latin-digits.js?v=20260823-latn"></script>'
          if 'flosi-latin-digits.js' not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          idx=Path('preview/index.html')
          t=idx.read_text(encoding='utf-8')
          t=re.sub(r'flosi2\.html\?v=[^\"\']+','flosi2.html?v=20260823-latn',t)
          idx.write_text(t,encoding='utf-8')
          PY
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name 'Flosi Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add preview/flosi2.html preview/index.html
          git commit -m 'fix: use English digits everywhere in Flosi'
          git push origin main
