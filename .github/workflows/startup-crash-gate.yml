name: Flosi Startup Crash Gate
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Run startup crash check on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.flosi.app || true
            adb shell monkey -p com.flosi.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell dumpsys activity activities > flosi-activity.txt 2>&1
            adb logcat -d > flosi-startup-logcat.txt 2>&1
            grep -n -E -A 120 -B 20 'FATAL EXCEPTION|AndroidRuntime|Process: com\.flosi\.app' flosi-startup-logcat.txt > flosi-crash.txt || true
            if grep -q -E 'FATAL EXCEPTION|Process: com\.flosi\.app' flosi-startup-logcat.txt; then
              echo 'Flosi startup crash detected. See flosi-crash.txt and flosi-startup-logcat.txt.'
              exit 1
            fi
            if ! grep -q 'com.flosi.app' flosi-activity.txt; then
              echo 'Flosi process/activity is not present after launch.' > flosi-crash.txt
              exit 1
            fi
            exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flosi-startup-evidence
          path: |
            flosi-startup-logcat.txt
            flosi-crash.txt
            flosi-activity.txt
          if-no-files-found: warn
