name: Flosi Startup Crash Gate
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Run startup crash check on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.flosi.app || true
            adb shell monkey -p com.flosi.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell dumpsys activity activities | grep -q 'com.flosi.app'
            if adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime:.*com\.flosi\.app|Process: com\.flosi\.app' ; then
              adb logcat -d
              exit 1
            fi
            adb logcat -d > flosi-startup-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flosi-startup-logcat
          path: flosi-startup-logcat.txt
          if-no-files-found: ignore
