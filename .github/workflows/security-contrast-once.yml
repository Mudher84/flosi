name: Flosi Security Contrast Once
on:
  push:
    paths:
      - '.github/workflows/security-contrast-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire security contrast runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('preview/flosi2.html')
          text=html.read_text(encoding='utf-8')
          tag='<script src="flosi-security-contrast.js?v=20260823-security-contrast-1"></script>'
          if tag not in text:
              anchor='</body>'
              if anchor not in text:
                  raise SystemExit('body anchor not found')
              text=text.replace(anchor,tag+'\n'+anchor)
              html.write_text(text,encoding='utf-8')

          index=Path('preview/index.html')
          t=index.read_text(encoding='utf-8')
          import re
          t=re.sub(r'flosi2\.html\?v=[^"\'<>]+','flosi2.html?v=20260823-security-contrast-1',t)
          index.write_text(t,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/security-contrast-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/flosi2.html preview/index.html .github/workflows/security-contrast-once.yml
          git commit -m 'fix: make password security warning readable'
          git push
