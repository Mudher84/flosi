name: Flosi Runtime Smoke Once
on:
  push:
    paths:
      - '.github/workflows/runtime-smoke-once.yml'
  pull_request:
    paths:
      - '.github/workflows/runtime-smoke-once.yml'
permissions:
  contents: read
jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Runtime smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
            test -n "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.flosi.app || true
            adb shell am start -W -n com.flosi.app/.MainActivity | tee launch.txt
            sleep 5

            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window-home.xml >/dev/null
            grep -q 'فلوسي' window-home.xml
            grep -q 'إجمالي أموالك' window-home.xml

            cat > /tmp/tap_text.py <<'PY'
            import re, subprocess, sys, xml.etree.ElementTree as ET
            target=sys.argv[1]
            for attempt in range(5):
                subprocess.run(['adb','shell','uiautomator','dump','/sdcard/window.xml'],stdout=subprocess.DEVNULL,check=True)
                subprocess.run(['adb','pull','/sdcard/window.xml','/tmp/window.xml'],stdout=subprocess.DEVNULL,check=True)
                root=ET.parse('/tmp/window.xml').getroot()
                for node in root.iter('node'):
                    text=(node.attrib.get('text') or '')
                    desc=(node.attrib.get('content-desc') or '')
                    if target in text or target in desc:
                        b=node.attrib.get('bounds','')
                        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',b)
                        if not m:
                            continue
                        x=(int(m.group(1))+int(m.group(3)))//2
                        y=(int(m.group(2))+int(m.group(4)))//2
                        subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
                        sys.exit(0)
                subprocess.run(['adb','shell','input','swipe','540','1750','540','700','350'],check=True)
            print(f'Could not find UI text: {target}',file=sys.stderr)
            sys.exit(2)
            PY

            python3 /tmp/tap_text.py 'أنا'
            sleep 2
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window-me.xml >/dev/null
            grep -q 'الحسابات والمحافظ' window-me.xml

            python3 /tmp/tap_text.py 'الأمان والنسخ'
            sleep 2
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window-security.xml >/dev/null
            grep -q 'حماية حقيقية وفشل مغلق' window-security.xml
            grep -q 'القفل التلقائي' window-security.xml

            adb shell input keyevent KEYCODE_BACK
            sleep 1
            python3 /tmp/tap_text.py 'الاستيراد والتصدير'
            sleep 2
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window-export.xml >/dev/null
            grep -q 'ملفات حقيقية' window-export.xml
            grep -q 'Excel XLSX' window-export.xml

            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell monkey -p com.flosi.app -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 3

            adb logcat -d > runtime-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.flosi\.app.*has died|ANR in com\.flosi\.app' runtime-logcat.txt; then
              echo 'Runtime crash/ANR detected'
              exit 3
            fi

            adb shell dumpsys activity activities > activities.txt
            grep -q 'com.flosi.app' activities.txt
            echo 'FLOSI_EMULATOR_RUNTIME_PASS'
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flosi-runtime-smoke
          path: |
            launch.txt
            window-home.xml
            window-me.xml
            window-security.xml
            window-export.xml
            runtime-logcat.txt
            activities.txt
