name: Flosi Security Preview Once
on:
  push:
    paths:
      - '.github/workflows/security-preview-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire security runtime and refresh cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('preview/flosi2.html')
          text=html.read_text(encoding='utf-8')
          script='<script src="flosi-security.js?v=20260823-security-v2"></script>'
          if script not in text:
              if '</body>' not in text:
                  raise SystemExit('body close anchor not found')
              text=text.replace('</body>',script+'\n</body>',1)
          html.write_text(text,encoding='utf-8')

          index=Path('preview/index.html')
          text=index.read_text(encoding='utf-8')
          text=re.sub(r'flosi2\.html\?v=[^\"\']+','flosi2.html?v=20260823-security-v2',text)
          index.write_text(text,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/security-preview-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/flosi2.html preview/index.html .github/workflows/security-preview-once.yml
          git commit -m 'feat: wire password biometric auto-lock and screenshot settings'
          git push
