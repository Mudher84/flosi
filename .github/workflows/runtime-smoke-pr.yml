name: Flosi Emulator Runtime Gate
on:
  pull_request:
permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Launch authenticated entry gate on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            test -s app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.flosi.app/.MainActivity | tee launch.txt
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml entry.xml >/dev/null

            grep -q 'Flosi' entry.xml
            grep -Eq 'المتابعة باستخدام Google|تسجيل الدخول|أموالك، بحساب موثّق' entry.xml

            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell monkey -p com.flosi.app -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml resumed.xml >/dev/null
            grep -q 'Flosi' resumed.xml

            adb logcat -d > runtime-logcat.txt
            ! grep -E 'FATAL EXCEPTION|ANR in com\.flosi\.app' runtime-logcat.txt
            echo FLOSI_ANDROID_ENTRY_RUNTIME_PASS

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flosi-emulator-runtime-evidence
          path: |
            launch.txt
            entry.xml
            resumed.xml
            runtime-logcat.txt
