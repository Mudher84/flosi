name: Flosi Security Change Button Once
on:
  push:
    paths:
      - '.github/workflows/security-change-button-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire security change fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('preview/flosi2.html')
          text=html.read_text(encoding='utf-8')
          script='<script src="flosi-security-change-fix.js?v=20260823-change-password-1"></script>'
          if 'flosi-security-change-fix.js' not in text:
              if '</body>' not in text:
                  raise SystemExit('body close not found')
              text=text.replace('</body>',script+'\n</body>')
              html.write_text(text,encoding='utf-8')
          index=Path('preview/index.html')
          t=index.read_text(encoding='utf-8')
          import re
          t=re.sub(r'flosi2\.html\?v=[^\"\']+','flosi2.html?v=20260823-change-password-1',t)
          index.write_text(t,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/security-change-button-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/flosi2.html preview/index.html .github/workflows/security-change-button-once.yml
          git commit -m 'fix: restore password change interaction in security preview'
          git push
