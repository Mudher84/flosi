name: Flosi Security No Password Once
on:
  push:
    paths:
      - '.github/workflows/security-no-password-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh security cache keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('preview/flosi2.html')
          text=html.read_text(encoding='utf-8')
          text=text.replace('flosi-security.js?v=20260823-security-v2','flosi-security.js?v=20260823-security-no-password-1')
          html.write_text(text,encoding='utf-8')
          index=Path('preview/index.html')
          text=index.read_text(encoding='utf-8')
          import re
          text=re.sub(r'flosi2\.html\?v=[^\"\']+','flosi2.html?v=20260823-security-no-password-1',text)
          index.write_text(text,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/security-no-password-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/flosi2.html preview/index.html .github/workflows/security-no-password-once.yml
          git commit -m 'fix: remove password from Flosi security preview'
          git push
